# Database di sviluppo: applica le migrazioni e i dati di esempio al primo avvio.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: albo
      POSTGRES_USER: albo
      POSTGRES_PASSWORD: albo
    ports:
      - "5432:5432"
    volumes:
      - ./db/init/00_init.sh:/docker-entrypoint-initdb.d/00_init.sh:ro
      - ./db/migrations:/albo/migrations:ro
      - ./db/seed:/albo/seed:ro
      - albo-data:/var/lib/postgresql/data
volumes:
  albo-data:
